name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pravahx_test
          POSTGRES_USER: pravahx_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pravahx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: pip install -e ".[dev,backend]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy core/pravahx backend/app

      - name: Unit tests
        run: pytest tests/unit/ --cov=core/pravahx --cov-report=term-missing --junitxml=test-results.xml

      - name: Integration tests
        run: pytest tests/integration/ -m "not gpu" --junitxml=integration-results.xml
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pravahx_test
          POSTGRES_USER: pravahx_test
          POSTGRES_PASSWORD: test_password
          REDIS_URL: redis://localhost:6379/0

      - name: Generate hydrograph plot
        run: python scripts/plot_hec_ras_hydrograph.py

      - name: Upload hydrograph plot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hec-ras-breach-hydrograph
          path: artifacts/hec_ras_hydrograph.png

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*-results.xml"

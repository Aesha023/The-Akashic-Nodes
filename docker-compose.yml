# PravahX — Docker Compose
# Starts the entire backend platform: api, worker, beat, postgis, redis, minio, titiler.
# Target: single Linux VM (constraint B)
# Usage: docker compose up -d
# Secure mode: docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d

services:
  # ── Database (PostGIS) ──────────────────────────────────────
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pravahx}
      POSTGRES_USER: ${POSTGRES_USER:-pravahx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pravahx_dev_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pravahx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db
          - postgis

  # ── Redis (Broker & Cache) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object storage (MinIO) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── TiTiler (COG tile server) ─────────────────────────────────
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      PORT: "8000"
      TITILER_ENDPOINT: /tiles

  # ── FastAPI Backend ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.app.main:create_app --factory --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pravahx}
      POSTGRES_USER: ${POSTGRES_USER:-pravahx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pravahx_dev_secret}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-pravahx_super_secret_jwt_key_default_32_bytes_long}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Celery Worker (Simulation & Heavy Compute) ──────────────
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.app.core.celery_app worker --concurrency=2 --loglevel=info
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pravahx}
      POSTGRES_USER: ${POSTGRES_USER:-pravahx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pravahx_dev_secret}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-pravahx_super_secret_jwt_key_default_32_bytes_long}
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - worker_data:/tmp/pravahx

  # ── Celery Beat (Lake Watch & Periodic Tasks) ───────────────
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.app.core.celery_app beat --loglevel=info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0

  # ── Worker (GPU / SPH tasks) ────────────────────────────────
  # Disabled by default — no local GPU (constraint A).
  # Enable with: docker compose --profile gpu up -d
  worker-gpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.app.core.celery_app worker -Q gpu --concurrency=1 --loglevel=info
    restart: unless-stopped
    profiles:
      - gpu
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false

  # ── Frontend (UI) ───────────────────────────────────────────
  # Profiled to keep backend-only deployment clean
  # Enable with: docker compose --profile frontend up -d
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}

volumes:
  pgdata:
  minio_data:
  worker_data:

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, type check and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pravahx_test
          POSTGRES_USER: pravahx_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pravahx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: pip install -e ".[dev,backend]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy core/pravahx backend/app

      - name: Validate documentation table consistency
        run: python scripts/check_engine_table.py

      - name: Validate zero banned strings
        run: python scripts/check_banned_strings.py

      - name: Validate generated TypeScript client
        run: python scripts/check_generated_client.py

      - name: Unit tests
        run: pytest tests/unit/ --cov=core/pravahx --cov-report=term-missing --junitxml=test-results.xml

      - name: Integration tests
        run: pytest tests/integration/ -m "not gpu" --junitxml=integration-results.xml
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pravahx_test
          POSTGRES_USER: pravahx_test
          POSTGRES_PASSWORD: test_password
          REDIS_URL: redis://localhost:6379/0

      - name: Generate hydrograph plot
        run: python scripts/plot_hec_ras_hydrograph.py

      - name: Upload hydrograph plot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hec-ras-breach-hydrograph
          path: artifacts/hec_ras_hydrograph.png

      - name: Generate Tier-0 Demo Map and PDF Brief
        run: |
          python scripts/render_tier0_map.py
          python scripts/generate_pdf_brief.py
          python scripts/package_tier0_demo.py

      - name: Run Tier-0 Demo End-to-End API Smoke Test
        run: python scripts/smoke_test_api.py --in-process
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pravahx_test
          POSTGRES_USER: pravahx_test
          POSTGRES_PASSWORD: test_password
          REDIS_URL: redis://localhost:6379/0

      - name: Upload Tier-0 PDF Brief artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganga-tier0-screening-brief
          path: artifacts/ganga_tier0_brief.pdf

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*-results.xml"

  smoke-test:
    name: API End-to-End Smoke Test
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pravahx_test
          POSTGRES_USER: pravahx_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pravahx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: pip install -e ".[dev,backend]"

      - name: Run Live API Server & Execute Smoke Test
        run: |
          uvicorn backend.app.main:create_app --factory --host 127.0.0.1 --port 8000 &
          API_PID=$!
          python -c '
          import time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health") as resp:
                      if resp.status == 200:
                          print("API server is live!")
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Server failed to start")
          '
          python scripts/smoke_test_api.py --base-url http://127.0.0.1:8000
          kill $API_PID || true
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pravahx_test
          POSTGRES_USER: pravahx_test
          POSTGRES_PASSWORD: test_password
          REDIS_URL: redis://localhost:6379/0

# PravahX — Docker Compose
# Target: single Linux VM (constraint B)
# Usage: docker compose up -d
# Secure mode: docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d

services:
  # ── Database ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pravahx}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object storage (MinIO) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Worker (CPU tasks) ──────────────────────────────────────
  worker-cpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker -Q cpu --concurrency=2 --loglevel=info
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - worker_data:/tmp/pravahx

  # ── Worker (GPU / SPH tasks) ────────────────────────────────
  # Disabled by default — no local GPU (constraint A).
  # Enable with: docker compose --profile gpu up -d
  worker-gpu:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker -Q gpu --concurrency=1 --loglevel=info
    restart: unless-stopped
    profiles:
      - gpu
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    # Uncomment when GPU is available:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Worker (IO tasks) ───────────────────────────────────────
  worker-io:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app worker -Q io --concurrency=4 --loglevel=info
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env

  # ── Scheduler (periodic tasks) ──────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}

  # ── Tile service (COG tiles — choice made in Phase 8) ───────
  # Placeholder: TiTiler or equivalent, to be configured in Phase 8.
  # tiles:
  #   image: ghcr.io/developmentseed/titiler:latest
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     TITILER_ENDPOINT: /tiles

volumes:
  pgdata:
  minio_data:
  worker_data:

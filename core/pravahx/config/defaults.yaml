# ──────────────────────────────────────────────────────────────
# PravahX — Default parameters
# Every value has a comment stating its source and rationale.
# Override in the scenario YAML or .env. Never override silently.
# ──────────────────────────────────────────────────────────────

# Depth threshold for extent and arrival time (metres).
# Cells with maximum depth below this are not considered inundated.
# Source: common practice in flood mapping; 0.1 m is conservative
# enough to exclude numerical noise while catching shallow inundation.
depth_threshold_m: 0.1

# Domain defaults
domain:
  reach_length_km: 60      # Downstream distance from the source
  buffer_km: 5              # Lateral buffer on each side of the reach

# Delft3D FM defaults
delft3d_fm:
  cell_size_coarse_m: 100   # Floodplain cell size
  cell_size_fine_m: 30      # Channel and near-source cell size
  horizon_h: 12             # Simulation duration in hours
  output_interval_min: 10   # Map output interval for arrival time accuracy
  courant_max: 0.7          # Maximum Courant number (stability)
  # Source: Deltares documentation, typical 2D unstructured

# DualSPHysics defaults
dualsphysics:
  particle_spacing_m: 2     # Inter-particle distance
  near_field_km: 2          # Near-field domain extent
  time_limit_s: 7200        # Maximum solver wall time (2 hours)
  # Source: DualSPHysics user guide, adjusted for dam-break scale

# Breach defaults
breach:
  # Froehlich (2008) ensemble spread.
  # The ensemble is built by applying ± one standard deviation of
  # the prediction error to the breach width and formation time.
  # Source: Froehlich (2008), Table 2 — prediction errors.
  # IMPORTANT: exact coefficients MUST be confirmed against the paper
  # before coding. Placeholder until user supplies equations.
  ensemble_sigma_multiplier: 1.0

# Comparison defaults
compare:
  # Agreement classes for the depth-difference map (metres).
  # Source: adapted from common flood model comparison practice.
  agreement_classes:
    - {label: "good",     max_diff_m: 0.3}
    - {label: "moderate", max_diff_m: 1.0}
    - {label: "poor",     max_diff_m: null}  # no upper bound
  # Minimum F-score to accept without refinement.
  f_score_threshold: 0.6
  max_refinements: 2

# Coupling defaults
coupling:
  # Maximum allowed volume error at the SPH-to-FM hand-off.
  # Fraction of the total released volume.
  volume_tolerance_fraction: 0.05

# Impact defaults
impact:
  # Hazard class boundaries: (depth_m, velocity_m_s) thresholds.
  # Source: to be cited from published classification in docs/SCIENCE.md.
  hazard_classes:
    - {label: "low",      max_depth_m: 0.5, max_velocity_ms: 0.5}
    - {label: "moderate", max_depth_m: 1.5, max_velocity_ms: 1.5}
    - {label: "high",     max_depth_m: 2.5, max_velocity_ms: 2.5}
    - {label: "extreme",  max_depth_m: null, max_velocity_ms: null}

# Earth Engine defaults
gee:
  # Sentinel-1 flood detection threshold (ratio).
  # Source: UN-SPIDER recommended practice (change ratio).
  s1_change_ratio_threshold: 1.25
  # Minimum patch size to keep (m²).
  min_patch_m2: 10000
  # HAND mask threshold for mountainous terrain (metres).
  hand_mask_m: 15
  # Slope mask threshold (degrees).
  slope_mask_deg: 5

# Tier 0 (HAND) defaults
tier0:
  # Peak attenuation factor per km downstream.
  # Source: simple empirical; documented as conservative first estimate.
  attenuation_per_km: 0.01

# Cascade defaults
cascade:
  # Maximum number of downstream dams to check.
  max_chain_length: 5

# PravahX — Secure mode (offline / air-gapped) Docker Compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
#
# This override:
# 1. Isolates all services inside an internal bridge network with zero outbound internet access.
# 2. Sets PRAVAHX_SECURE_MODE=secure to disable external Earth Engine / Overpass / GEE / remote queries.
# 3. Ensures all pipeline models run strictly using local pre-staged datasets in /app/data.

services:
  api:
    environment:
      PRAVAHX_SECURE_MODE: "secure"
    networks:
      - internal

  worker:
    environment:
      PRAVAHX_SECURE_MODE: "secure"
    networks:
      - internal

  beat:
    environment:
      PRAVAHX_SECURE_MODE: "secure"
    networks:
      - internal

  postgis:
    networks:
      - internal

  redis:
    networks:
      - internal

  minio:
    networks:
      - internal

  titiler:
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: true   # Air-gapped: no outbound internet access
